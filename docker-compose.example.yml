# Example: copy to docker-compose.yml and run `docker compose up -d`.
# Works on Linux, macOS and Windows (Docker Desktop): all host paths are relative.
# Docker pulls the right architecture (linux/amd64 or linux/arm64) automatically.
services:
  mapstore:
    image: ${MAPSTORE_IMAGE:-docker.io/pompeot1987/mapstore-hardened:dev}
    ports:
      # 127.0.0.1 = reachable only from this computer; remove it to expose on the network
      - "127.0.0.1:${MAPSTORE_PORT:-8080}:8080"
    # memory limit: the JVM heap is a percentage of it (MaxRAMPercentage in the image).
    # 512m for light use (demo, few users), 1g-1.5g for the printing variant.
    mem_limit: 768m
    # The image sets JAVA_OPTS with sensible defaults; to override them uncomment and
    # keep -Ddatadir.location, e.g.:
    # environment:
    #   - JAVA_OPTS=-XX:+UseSerialGC -XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError -Ddatadir.location=/usr/local/tomcat/datadir
    volumes:
      # data directory: maps database (see example/datadir/geostore-datasource-ovr.properties),
      # your configs and extensions can live here
      - ./example/datadir:/usr/local/tomcat/datadir
      # optional: your own configuration (tokens stay on your machine)
      # - ./my-config/localConfig.json:/usr/local/tomcat/webapps/mapstore/configs/localConfig.json:ro
      # optional: MapStore extensions
      # - ./my-extensions:/usr/local/tomcat/webapps/mapstore/extensions:ro
    restart: unless-stopped
