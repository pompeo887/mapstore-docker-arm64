# Builds the multi-arch images and pushes them to Docker Hub when a tag like v2026.02.01 is pushed.
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Docker Hub access token, Read & Write).
name: docker

on:
  push:
    tags: ["v*", "dev*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.ref_name, 'dev')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: mapstore
            suffix: ""
          - target: mapstore-printing
            suffix: "-printing"
    steps:
      - uses: actions/checkout@v4

      - name: MapStore version from the Dockerfile
        run: echo "MS_VERSION=$(sed -n 's/^ARG MAPSTORE_VERSION=//p' Dockerfile)" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=MapStore hardened ${{ env.MS_VERSION }}${{ matrix.suffix }}
            org.opencontainers.image.description=Unofficial multi-arch (amd64/arm64) MapStore ${{ env.MS_VERSION }} image with patched libraries
            org.opencontainers.image.version=${{ env.MS_VERSION }}${{ matrix.suffix }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=BSD-2-Clause AND GPL-3.0-only
            org.opencontainers.image.vendor=pompeo887 (unofficial, not affiliated with GeoSolutions)
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mapstore-hardened:${{ env.MS_VERSION }}${{ matrix.suffix }}

  dev:
    # builds the `dev` image (MapStore master) on demand or with a tag like dev-5613d59
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          # no attestations: Docker Scout ignores the VEX embedded in /usr/share/vex
          # when an image has attestations
          provenance: false
          sbom: false
          # labels shown by Docker Hub under "Source & Build Information"
          labels: |
            org.opencontainers.image.title=MapStore hardened (dev)
            org.opencontainers.image.description=Unofficial multi-arch (amd64/arm64) MapStore master image with patched libraries
            org.opencontainers.image.version=dev-5613d59
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=BSD-2-Clause AND GPL-3.0-only
            org.opencontainers.image.vendor=pompeo887 (unofficial, not affiliated with GeoSolutions)
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mapstore-hardened:dev
